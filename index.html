<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KIRA – Pharmacy Voice Assistant</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { color: #2c7a4b; }
    #status { color: #888; font-size: 14px; margin-bottom: 12px; }
    #transcript { background: white; padding: 16px; border-radius: 8px; min-height: 80px; margin-bottom: 12px; }
    #response { background: #e8f5e9; padding: 16px; border-radius: 8px; min-height: 80px; margin-bottom: 20px; }
    button {
      padding: 12px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2c7a4b;
      color: white;
      margin-right: 8px;
    }
    button:disabled { background: #aaa; }
    #history-box { margin-top: 24px; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <h1>KIRA</h1>
  <p>Your gesund.de pharmacy assistant</p>

  <div id="status">Press and hold to speak</div>
  <div><strong>You said:</strong></div>
  <div id="transcript">–</div>
  <div><strong>KIRA:</strong></div>
  <div id="response">–</div>

  <button id="btn" onmousedown="startRecording()" onmouseup="stopRecording()">
    🎤 Hold to speak
  </button>
  <button onclick="clearHistory()">Clear history</button>

  <div id="history-box"></div>

<script src="/static/app.js"></script>

</body>
</html>
